name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    # Everything that runs without TI-Nspire. Linux: the translator and result
    # converter. Windows adds the Notes-safety tests and the transport tests
    # (bridge.lua run in lupa against a fake clipboard; the real one is untouched).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
            extra: --with "pywin32>=306" --with lupa
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: pytest
        shell: bash
        run: >
          uv run --no-project --python ${{ matrix.python }}
          --with pytest --with "sympy>=1.13" --with "antlr4-python3-runtime==4.11.*" ${{ matrix.extra }}
          pytest -q tests
