name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    # Everything that runs without TI-Nspire, with the newest dependency
    # versions the scripts allow (an early warning before a lock update).
    # Linux 3.11: the translator and result converter. Linux 3.13 and macOS add
    # the transport tests (bridge.lua run in lupa against a fake clipboard; the
    # real one is untouched), the macOS backend against a fake pasteboard and the
    # MCP server tests; macOS also round-trips through its real pasteboard
    # (NSPIRE_REAL_PASTEBOARD). Windows adds the Notes-safety tests.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
            extra: --with lupa --with "mcp>=1.2,<2"
          - os: macos-latest
            python: "3.13"
            extra: --with "pyobjc-framework-Cocoa>=10.3" --with lupa --with "mcp>=1.2,<2"
          - os: windows-latest
            python: "3.13"
            extra: --with "pywin32>=306" --with lupa --with "mcp>=1.2,<2"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: pytest
        shell: bash
        env:
          NSPIRE_REAL_PASTEBOARD: "1"
        run: >
          uv run --no-project --python ${{ matrix.python }}
          --with pytest --with "sympy>=1.13" --with "antlr4-python3-runtime==4.11.*" ${{ matrix.extra }}
          pytest -q tests

  locked:
    # The same tests with the exact versions users run: server.py.lock, which
    # pins everything the other scripts use too (plus mcp).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: export server.py.lock
        shell: bash
        run: uv export --script server.py --no-hashes --quiet -o "$RUNNER_TEMP/locked.txt"
      - name: pytest
        shell: bash
        run: >
          uv run --no-project --python 3.13 --with-requirements "$RUNNER_TEMP/locked.txt"
          --with pytest --with lupa
          pytest -q tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff
        run: uvx ruff@0.17.6 check --output-format github .
